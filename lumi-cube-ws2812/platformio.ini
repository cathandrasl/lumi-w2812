[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Optional: Enable serial monitor to auto-open after upload
monitor_flags = 
    --eol=LF
    --echo

; Dependencies (none needed for this simple test)
lib_deps = 

; Build flags (optional - for debugging)
build_flags = 
    -DCORE_DEBUG_LEVEL=3