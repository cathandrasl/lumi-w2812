[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600

; Libraries for our components
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.0    ; WS2812 LED strip
    bodmer/TFT_eSPI@^2.5.43               ; ST7789V display driver
    bblanchon/ArduinoJson@^6.21.3         ; JSON for API requests

; TFT_eSPI configuration for ST7789V
build_flags = 
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=280
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=27
    -D TFT_RST=12
    -D TFT_BL=32
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

; Upload settings
upload_speed = 921600
monitor_filters = esp32_exception_decoder